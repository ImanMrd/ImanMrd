<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pillAws" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="pillMsc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.08" />
    </linearGradient>

    <!-- Subtle Blueprint Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.65" />
    </pattern>
  </defs>

  <!-- Main Rounded Container -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="18" fill="url(#grid)" />

  <!-- Decorative Ambient Glows -->
  <circle cx="950" cy="90" r="220" fill="url(#glowCyan)" />
  <circle cx="180" cy="290" r="180" fill="url(#glowCyan)" />

  <!-- Top Accent Border Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#cyanAccent)" />

  <!-- Outer Subtle Border -->
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- ================= LEFT COLUMN: IDENTITY & POSITIONING ================= -->
  
  <!-- Location & Availability Badge -->
  <g transform="translate(52, 42)">
    <rect x="0" y="0" width="445" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="15" r="4.5" fill="#10B981" />
    <circle cx="18" cy="15" r="8" fill="#10B981" fill-opacity="0.25" />
    <text x="34" y="19.5" fill="#CBD5E1" font-family=" 'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">TURIN, ITALY  •  CLOUD, DEVOPS &amp; AI ENGINEERING</text>
  </g>

  <!-- Name -->
  <text x="52" y="126" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Iman Moradi Nezhad</text>

  <!-- Role Subtitle -->
  <text x="52" y="164" fill="url(#cyanAccent)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="0.2">Cloud Infrastructure  •  DevOps Automation  •  Applied AI Systems</text>

  <!-- Concise Value Statement -->
  <text x="52" y="202" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Designing automated AWS cloud environments, resilient Kubernetes &amp; CI/CD pipelines,
  </text>
  <text x="52" y="224" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    and production AI applications that turn complex data into measurable operational speed.
  </text>

  <!-- Credential Pills Row -->
  <!-- Pill 1: AWS Certified -->
  <g transform="translate(52, 256)">
    <rect x="0" y="0" width="268" height="38" rx="8" fill="url(#pillAws)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="19" r="6" fill="#F59E0B" />
    <text x="35" y="24" fill="#FDE68A" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">AWS Certified Cloud Practitioner</text>
  </g>

  <!-- Pill 2: M.Sc. Engineering -->
  <g transform="translate(334, 256)">
    <rect x="0" y="0" width="352" height="38" rx="8" fill="url(#pillMsc)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="19" r="6" fill="#38BDF8" />
    <text x="35" y="24" fill="#BAE6FD" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">M.Sc. Internet &amp; Multimedia Engineering (Telecom)</text>
  </g>

  <!-- ================= RIGHT COLUMN: ARCHITECTURAL VISUALIZATION ================= -->
  <g transform="translate(730, 36)">
    <!-- Outer Architecture Frame -->
    <rect x="0" y="0" width="422" height="268" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Window Top Bar -->
    <rect x="0" y="0" width="422" height="32" rx="14" fill="#0F172A" />
    <circle cx="18" cy="16" r="4.5" fill="#EF4444" />
    <circle cx="32" cy="16" r="4.5" fill="#F59E0B" />
    <circle cx="46" cy="16" r="4.5" fill="#10B981" />
    <text x="66" y="20" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">system-architecture://cloud-ai-platform</text>

    <!-- Node 1: Cloud & IaC -->
    <g transform="translate(22, 50)">
      <rect x="0" y="0" width="378" height="54" rx="9" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" />
      <rect x="12" y="12" width="30" height="30" rx="6" fill="#0284C7" fill-opacity="0.25" />
      <text x="27" y="32" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">IaC</text>
      <text x="54" y="23" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Cloud Infrastructure &amp; Provisioning</text>
      <text x="54" y="41" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">AWS (VPC • EC2 • S3)  |  Terraform  |  Linux</text>
      <rect x="304" y="16" width="62" height="22" rx="11" fill="#0EA5E9" fill-opacity="0.15" />
      <text x="335" y="31" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">AUTOMATED</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="211" y1="104" x2="211" y2="122" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="211" cy="113" r="3" fill="#38BDF8" />

    <!-- Node 2: DevOps & Containers -->
    <g transform="translate(22, 122)">
      <rect x="0" y="0" width="378" height="54" rx="9" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.7" />
      <rect x="12" y="12" width="30" height="30" rx="6" fill="#4F46E5" fill-opacity="0.25" />
      <text x="27" y="32" text-anchor="middle" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">K8s</text>
      <text x="54" y="23" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Container Orchestration &amp; CI/CD</text>
      <text x="54" y="41" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Docker  |  Kubernetes  |  GitHub Actions  |  Pytest</text>
      <rect x="304" y="16" width="62" height="22" rx="11" fill="#6366F1" fill-opacity="0.15" />
      <text x="335" y="31" text-anchor="middle" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">RESILIENT</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="211" y1="176" x2="211" y2="194" stroke="#34D399" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="211" cy="185" r="3" fill="#34D399" />

    <!-- Node 3: Applied AI & Backend -->
    <g transform="translate(22, 194)">
      <rect x="0" y="0" width="378" height="54" rx="9" fill="#0F172A" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.7" />
      <rect x="12" y="12" width="30" height="30" rx="6" fill="#059669" fill-opacity="0.25" />
      <text x="27" y="32" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">AI</text>
      <text x="54" y="23" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Applied AI &amp; High-Speed APIs</text>
      <text x="54" y="41" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Databricks  |  Whisper &amp; Claude  |  FastAPI  |  ML</text>
      <rect x="304" y="16" width="62" height="22" rx="11" fill="#10B981" fill-opacity="0.15" />
      <text x="335" y="31" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SCALABLE</text>
    </g>
  </g>
</svg>
